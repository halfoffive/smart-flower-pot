# ============================================================
# Tauri 客户端构建与发布
#
# 触发条件：手动运行 workflow_dispatch
#
# 构建策略：
# - 使用 bun 安装前端依赖
# - 使用 tauri-action 构建全平台桌面/移动客户端
# - 构建产物自动上传到 GitHub Release（预发布，非草稿）
# - 支持 Windows x64、Linux x64、macOS (Arm + Intel)、Android APK
#
# 所需 GitHub Secrets：
# - ANDROID_KEY_ALIAS: Android 签名密钥别名
# - ANDROID_KEY_BASE64: Android 签名密钥（base64 编码，单行无换行）
# - ANDROID_KEY_PASSWORD: Android 签名密钥密码
# ============================================================

name: Build Tauri Client

on:
  workflow_dispatch:

concurrency:
  group: tauri-build
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-latest"
            args: ""
            mobile: "android"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: 安装前端依赖
        run: bun install --cwd desktop

      - name: 安装 Rust stable（桌面端）
        if: matrix.mobile == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Rust stable（Android）
        if: matrix.mobile == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: desktop/src-tauri -> target

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev pkg-config libudev-dev

      - name: 安装 JDK（Android）
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 安装 Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3

      - name: 安装 Android NDK
        if: matrix.mobile == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: 初始化移动端项目
        if: matrix.mobile != ''
        run: cd desktop && bunx @tauri-apps/cli ${{ matrix.mobile }} init

      - name: 配置 Android 签名
        if: matrix.mobile == 'android'
        run: |
          cd desktop/src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: 注入 Android release 签名配置
        if: matrix.mobile == 'android'
        run: |
          GRADLE_FILE="desktop/src-tauri/gen/android/app/build.gradle.kts"
          sed -i '1s/^/import java.io.FileInputStream\n/' "$GRADLE_FILE"
          sed -i '/buildTypes {/i\    signingConfigs {\n        create("release") {\n            val keystorePropertiesFile = rootProject.file("keystore.properties")\n            val keystoreProperties = Properties()\n            if (keystorePropertiesFile.exists()) {\n                keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n            }\n            keyAlias = keystoreProperties["keyAlias"] as String?\n            keyPassword = keystoreProperties["password"] as String?\n            storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }\n            storePassword = keystoreProperties["password"] as String?\n        }\n    }\n' "$GRADLE_FILE"
          sed -i '/getByName("release") {/,/isMinifyEnabled/s/isMinifyEnabled = true/isMinifyEnabled = true\n            signingConfig = signingConfigs.getByName("release")/' "$GRADLE_FILE"

      - name: 构建 Tauri 应用并发布
        uses: tauri-apps/tauri-action@ca517bcbe58fd7012408d7ddfaeff950428bdeb1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          projectPath: desktop
          tagName: app-v__VERSION__
          releaseName: "智能花盆 v__VERSION__"
          releaseBody: "智能花盆 Tauri 客户端。请根据您的操作系统下载对应的安装包。"
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}
